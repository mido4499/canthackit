name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  # The daily job pushes with GITHUB_TOKEN, which doesn't trigger push workflows, so
  # republish whenever it finishes instead.
  workflow_run:
    workflows: ["Update events"]
    types: [completed]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write # to publish to GitHub Pages
  id-token: write # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The page loads events.json from next to itself.
      - name: Build site
        run: |
          mkdir _site
          cp site/index.html data/events.json _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
